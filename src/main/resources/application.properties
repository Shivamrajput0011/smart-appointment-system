spring.application.name=smart-appointment-management-system
server.port=8080

# Real credentials live OUTSIDE source control. Provide them in either:
#   1) config/database.properties  (copy config/database.properties.example), or
#   2) environment variables DB_URL, DB_USERNAME, DB_PASSWORD
spring.config.import=optional:file:./config/database.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_appointment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# 'update' creates/updates tables automatically. Use database/schema.sql for manual setup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
